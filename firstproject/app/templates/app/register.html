{% extends 'app/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Kayıt Ol — Tikatik{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center py-4">
    <div class="col-lg-5 col-md-7">

        <div class="text-center mb-4">
            <div style="font-size:2.5rem;margin-bottom:0.5rem;">✨</div>
            <h2 class="fw-bold mb-1">Hesap Oluştur</h2>
            <p style="font-size:0.9rem;">Tikatik'e üye ol, etkinlikleri keşfet</p>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <form method="POST" autocomplete="off">
                    {% csrf_token %}
                    {{ RegistrationForm | crispy }}
                    <div class="d-grid mt-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-person-plus me-2"></i>Kayıt Ol
                        </button>
                    </div>
                </form>

                <hr class="my-4">
                <p class="text-center mb-0" style="font-size:0.88rem;">
                    Zaten hesabın var mı?
                    <a href="{% url 'login' %}" class="fw-semibold text-decoration-none"
                       style="color:var(--purple-light);">Giriş Yap</a>
                </p>
            </div>
        </div>

    </div>
</div>
{% endblock %}
